<!-- BeamPad themed-icon (monochrome) source for Android 13+ (1024x1024).
     Single-color white glyph on transparent; system applies the tint.
     Regenerate PNGs with: scripts/gen-icon.sh (rsvg-convert). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <circle cx="512" cy="512" r="280" fill="none" stroke="#FFFFFF" stroke-width="72"/>
  <circle cx="512" cy="512" r="92" fill="#FFFFFF"/>
</svg>
