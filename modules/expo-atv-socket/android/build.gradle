plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.atvsocket'
version = '0.1.0'

android {
  namespace "expo.modules.atvsocket"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation("org.bouncycastle:bcprov-jdk15to18:1.78.1")
  implementation("org.bouncycastle:bcpkix-jdk15to18:1.78.1")
}
