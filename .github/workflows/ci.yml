name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Lint · Typecheck · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify protobuf bundle is up to date
        run: |
          npm run gen:proto
          if [ -n "$(git status --porcelain src/proto)" ]; then
            echo "::error::src/proto/bundle.* is stale. Run 'npm run gen:proto' and commit the result."
            exit 1
          fi

      - name: Typecheck (strict tsc)
        run: npm run typecheck

      - name: Lint (eslint, zero warnings)
        run: npm run lint

      - name: Tests with coverage gates
        run: npm run test:ci

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              const row = (k) => '| ' + k.padEnd(10) + ' | ' + ['statements','branches','functions','lines'].map(m => String(s[m].pct).padStart(6) + '%').join(' | ') + ' |';
              const out = ['| metric     | statements | branches | functions | lines |', '|------------|------------|----------|-----------|-------|', row('total')].join('\n');
              console.log(out);
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + '\n');
            "
          else
            echo "No coverage report (tests did not run)."
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  preview-apk:
    name: Preview APK (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Every main push produces a sideloadable debug APK — no manual builds.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install and prebuild
        run: |
          npm ci
          npx expo prebuild --platform android --no-install

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: beampad-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
