name: Release

# Tag-based release: push vMAJOR.MINOR.PATCH (e.g. v1.2.0) to build a signed
# AAB via local Gradle and attach it to a GitHub Release. No EAS account needed.
# Required repo secrets for signed builds: ANDROID_KEYSTORE_B64 (base64 of a
# release keystore), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
# Without secrets the workflow still produces an unsigned AAB artifact.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build type for manual runs'
        type: choice
        options: [aab, apk]
        default: apk

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  store-release:
    name: Store release (signed AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            TAG="0.0.0-dev"
          fi
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-dev)?$ ]]; then
            echo "::error::Tag must look like v1.2.3 (got ${GITHUB_REF#refs/tags/})"
            exit 1
          fi
          MAJOR="${TAG%%.*}"; REST="${TAG#*.}"; MINOR="${REST%%.*}"; PATCH="${REST#*.}"; PATCH="${PATCH%%-*}"
          CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          echo "app_version=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $TAG (versionCode $CODE)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Prebuild (CNG)
        run: npx expo prebuild --platform android --no-install
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}

      - name: Decode keystore
        id: keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret — producing unsigned build."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble signed AAB
        if: steps.keystore.outputs.signed == 'true' && (github.event.inputs.build-type != 'apk')
        working-directory: android
        run: >
          ./gradlew :app:bundleRelease --no-daemon
          -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore"
          -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}"
          -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}"
          -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}

      - name: Assemble APK (unsigned or manual dispatch)
        if: steps.keystore.outputs.signed != 'true' || github.event.inputs.build-type == 'apk'
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}

      - name: Collect artifacts
        id: collect
        run: |
          FILES=""
          for f in android/app/build/outputs/bundle/release/*.aab android/app/build/outputs/apk/release/*-release.apk; do
            [ -f "$f" ] && FILES="$FILES$f%0A" && echo "found: $f"
          done
          if [ -z "$FILES" ]; then
            echo "::error::No AAB or APK produced."
            exit 1
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          printf '%b' "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.app_version }}
          path: ${{ steps.collect.outputs.files }}
          if-no-files-found: error
          retention-days: 90

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.collect.outputs.files }}
          generate_release_notes: true
